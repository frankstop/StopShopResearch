[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stopshop-research"
version = "1.0.0"
description = "Anonymous longitudinal Stop & Shop catalog price research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Frank Valdez" }]
dependencies = []

[project.scripts]
stopshop-research = "stopshop_research.pipeline:main"

[tool.setuptools]
packages = ["stopshop_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

